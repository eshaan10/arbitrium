<!DOCTYPE html>
<!--
  MarketEdge — live pipeline preview (pre-Phase-5 scaffolding).

  Single static file, vanilla JS, no build step, served by FastAPI at /preview.
  Replaced by the Next.js dashboard in Phase 5.

  THE CENTRAL DISTINCTION THIS PAGE ENFORCES — two different products that must
  never share vocabulary:

  1. KALSHI-NATIVE DIRECTIONAL (the primary content). One platform, one action:
     buy Yes or buy No on a Kalshi market. Both are buys. It pays $1 if you are
     right and $0 if you are not, and it is only worth taking IF the sportsbook
     consensus is a better probability estimate than Kalshi's price. This is
     OUTCOME risk — the whole stake can be lost. Never described as guaranteed.

  2. CROSS-PLATFORM ARBITRAGE (secondary, advanced-only). Two accounts, two
     simultaneous fills, every outcome covered, so the payout does not depend on
     who wins. This is EXECUTION risk. It is a fundamentally different product
     and is deliberately DEMOTED here: a muted text tag on the card, full detail
     only in the panel, always naming the accounts required. Some arbitrages
     involve no Kalshi leg at all, which makes them not a Kalshi trade in any
     sense — those are labelled as such and kept out of the card entirely.

  Other rules carried from the project's principles:
  - NEVER HIDE UNCERTAINTY. Low-confidence events fade but are never filtered.
  - Arbitrage is EXEMPT from the confidence fade: it rests on no probability
    estimate, so consensus thinness is the wrong uncertainty to apply to it.
  - The stake simulator NEVER shows a single blended number for a directional
    bet — both outcomes, side by side, or nothing.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MarketEdge — Kalshi mispricing preview</title>
<style>
  :root {
    --bg:        #0a0b0d;
    --surface:   #121418;
    --surface-2: #171a1f;
    --border:    #23272e;
    --border-lit:#2f343d;
    --text:      #eceef1;
    --text-dim:  #a2a9b4;
    --muted:     #6d747f;

    --arb:       #ff2d55;
    --arb-glow:  rgba(255, 45, 85, 0.16);
    --buy:       #e33d5c;
    --signal:    #c9455f;
    --signal-dim:#8e3346;
    --warn:      #c9922b;
    --win:       #e8556f;
  }
  * { box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.55 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; padding: 28px 24px 48px;
  }
  .wrap { max-width: 1120px; margin: 0 auto; }

  header { border-bottom: 1px solid var(--border); padding-bottom: 18px; margin-bottom: 20px; }
  .title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  h1 .mark { color: var(--arb); }
  .tag { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600;
    color: var(--muted); border: 1px solid var(--border-lit); border-radius: 4px; padding: 2px 7px; }
  .lede { color: var(--text-dim); margin: 8px 0 0; max-width: 76ch; font-size: 13.5px; }
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted);
    font-size: 12px; margin-top: 14px; font-variant-numeric: tabular-nums; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
  .status.live .dot { background: var(--arb); box-shadow: 0 0 0 3px var(--arb-glow); }
  .status.error .dot { background: var(--warn); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px; margin: 20px 0 22px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; }
  .tile .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .tile .v { font-size: 22px; font-weight: 650; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .tile.accent { border-color: rgba(255,45,85,.32);
    background: linear-gradient(180deg, rgba(255,45,85,.07), transparent 70%), var(--surface); }
  .tile.accent .v { color: var(--arb); }

  .toolbar { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-end;
    justify-content: space-between; margin-bottom: 16px; }
  .filters { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-end; }
  .fgroup { display: flex; flex-direction: column; gap: 6px; }
  .flabel { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 999px; padding: 5px 12px; font-size: 12.5px; cursor: pointer;
    font-family: inherit; transition: background .12s, border-color .12s, color .12s; }
  .chip:hover { border-color: var(--border-lit); color: var(--text); }
  .chip[aria-pressed="true"] { background: rgba(255,45,85,.12);
    border-color: rgba(255,45,85,.5); color: #ffd3dc; }
  .chip .n { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 5px; font-size: 11.5px; }
  .chip[aria-pressed="true"] .n { color: rgba(255,211,220,.7); }

  .mode { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .mode button { background: var(--surface); border: 0; color: var(--text-dim); font-family: inherit;
    font-size: 12.5px; padding: 6px 14px; cursor: pointer; }
  .mode button[aria-pressed="true"] { background: rgba(255,45,85,.14); color: #ffd3dc; }

  /* ---------- event cards ---------- */
  .rows { display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 11px;
    padding: 16px 18px; border-left: 3px solid transparent; transition: border-color .12s, background .12s; }
  .card:hover { background: var(--surface-2); border-color: var(--border-lit); }
  .card.actionable { border-left-color: var(--buy); }
  .card .head { display: flex; justify-content: space-between; align-items: baseline;
    gap: 14px; flex-wrap: wrap; }
  .matchup { font-weight: 600; font-size: 15px; letter-spacing: -0.005em; }
  .matchup .at { color: var(--muted); font-weight: 400; margin: 0 5px; }
  .when { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* The recommendation — the one thing a Kalshi user came for. */
  .rec { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 13px 0 10px; }
  .rec-action { display: inline-flex; align-items: baseline; gap: 9px;
    background: rgba(227,61,92,.13); border: 1px solid rgba(227,61,92,.5);
    border-radius: 8px; padding: 8px 13px; }
  .rec-verb { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
    color: #ffc9d4; }
  .rec-team { font-size: 15px; font-weight: 650; }
  .rec-price { font-size: 15px; font-weight: 700; color: var(--buy); font-variant-numeric: tabular-nums; }
  .rec-none { color: var(--text-dim); font-size: 13.5px; font-style: italic; }

  /* Confidence: bars, not a bare number. */
  .conf { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; }
  .conf-bars { display: inline-flex; gap: 3px; }
  .conf-bars i { width: 6px; height: 15px; border-radius: 2px; background: var(--border-lit);
    display: inline-block; }
  .conf-bars i.on { background: var(--buy); }
  .conf-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

  .why { color: var(--text-dim); font-size: 13px; line-height: 1.55; margin: 0 0 11px; max-width: 82ch; }
  .why em { color: var(--text); font-style: normal; font-weight: 600; }
  .ctx { color: var(--muted); font-size: 11.5px; margin-bottom: 11px; font-variant-numeric: tabular-nums; }

  /* Stake simulator — both outcomes, never one blended number. */
  .stake { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 11px; }
  .stake label { font-size: 11.5px; color: var(--muted); }
  .stake input { background: var(--bg); border: 1px solid var(--border-lit); color: var(--text);
    border-radius: 6px; padding: 5px 9px; width: 92px; font-family: inherit; font-size: 13px;
    font-variant-numeric: tabular-nums; }
  .stake .arrow { color: var(--muted); }
  .outcomes { display: flex; gap: 10px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
  .oc { font-size: 12.5px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border-lit); }
  .oc .lab { color: var(--muted); font-size: 10.5px; text-transform: uppercase;
    letter-spacing: .05em; display: block; }
  .oc.win { color: var(--win); border-color: rgba(232,85,111,.45); }
  .oc.lose { color: var(--text-dim); }
  .stake .cap { font-size: 11px; color: var(--warn); }

  .foot { display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    border-top: 1px solid var(--border); padding-top: 10px; }
  .link { color: var(--buy); text-decoration: none; font-size: 12.5px; font-weight: 550; }
  .link:hover { text-decoration: underline; }
  /* Arbitrage on a card: a MUTED TEXT TAG. Never a filled badge — it must not
     out-shout the Kalshi-native recommendation. */
  .arb-tag { font-size: 11.5px; color: var(--muted); border: 1px dashed var(--border-lit);
    border-radius: 5px; padding: 2px 8px; }
  .detail-btn { margin-left: auto; background: transparent; border: 1px solid var(--border-lit);
    color: var(--text-dim); border-radius: 6px; padding: 5px 11px; font-size: 12px;
    cursor: pointer; font-family: inherit; }
  .detail-btn:hover { color: var(--text); border-color: var(--muted); }

  /* ---------- advanced block ---------- */
  .adv { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px; }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; }
  .m .k { font-size: 10px; text-transform: uppercase; letter-spacing: .055em; color: var(--muted); }
  .m .v { font-size: 14px; font-variant-numeric: tabular-nums; margin-top: 2px; font-weight: 550;
    color: var(--signal); }
  .m .v.neg, .m .v.none { color: var(--muted); font-weight: 440; }

  /* ---------- detail panel ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.62); backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 40; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100vw);
    background: var(--bg); border-left: 1px solid var(--border-lit); z-index: 50;
    transform: translateX(100%); transition: transform .2s cubic-bezier(.4,0,.2,1);
    overflow-y: auto; overflow-x: hidden; padding: 22px 24px 40px; }
  .panel.open { transform: translateX(0); }
  .panel-close { position: absolute; top: 16px; right: 18px; background: var(--surface);
    border: 1px solid var(--border-lit); color: var(--text-dim); border-radius: 7px;
    width: 30px; height: 30px; font-size: 16px; cursor: pointer; line-height: 1; font-family: inherit; }
  .panel-close:hover { color: var(--text); border-color: var(--muted); }

  .sec { margin: 22px 0 0; }
  .sec > h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  /* The arbitrage section is fenced: its own border and an explicit statement of
     which accounts it requires, so its language cannot bleed into the Kalshi view. */
  .arb-box { border: 1px solid rgba(255,45,85,.35); border-radius: 10px; padding: 14px 16px;
    background: linear-gradient(180deg, var(--arb-glow), transparent 60%), var(--surface); }
  .arb-box .req { font-size: 12px; color: #ffc9d4; margin-bottom: 9px; }
  .arb-box .nokalshi { color: var(--warn); }

  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .side { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 12px 14px; }
  .side .who { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .side .team { font-size: 13.5px; font-weight: 600; margin: 4px 0 8px; }
  .side .pair { display: flex; justify-content: space-between; font-size: 13px;
    font-variant-numeric: tabular-nums; padding: 3px 0; }
  .side .pair span:first-child { color: var(--muted); }
  .spark { display: block; width: 100%; height: 46px; margin-top: 8px; }
  .spark-note { font-size: 10.5px; color: var(--muted); margin-top: 5px; }

  .explain { background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
    padding: 12px 14px; margin-bottom: 8px; }
  .explain .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .explain .name { font-size: 13px; font-weight: 600; }
  .explain .val { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; color: var(--signal); }
  .explain .val.neg, .explain .val.na { color: var(--muted); font-weight: 450; }
  .explain p { margin: 5px 0 0; font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }

  table.books { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.books th { text-align: left; color: var(--muted); font-weight: 500; font-size: 10.5px;
    text-transform: uppercase; letter-spacing: .05em; padding: 0 8px 6px 0; }
  table.books td { padding: 5px 8px 5px 0; border-top: 1px solid var(--border);
    font-variant-numeric: tabular-nums; }
  table.books td.best { color: var(--signal); font-weight: 600; }

  dl.meta { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 12.5px; }
  dl.meta dt { color: var(--muted); }
  dl.meta dd { margin: 0; font-variant-numeric: tabular-nums; word-break: break-all; }
  .pill { font-size: 10.5px; padding: 1px 7px; border-radius: 4px; border: 1px solid var(--border-lit);
    color: var(--text-dim); }
  .pill.auth { color: #ffc9d4; border-color: rgba(227,61,92,.5); }

  .notice { background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 22px; color: var(--text-dim); }
  .notice strong { color: var(--text); }
  code { background: var(--surface-2); padding: 1.5px 5px; border-radius: 4px; font-size: 12.5px; color: var(--text-dim); }
  footer { margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--border);
    color: var(--muted); font-size: 11.5px; line-height: 1.7; }

  @media (max-width: 820px) {
    .compare { grid-template-columns: 1fr; }
    .conf { margin-left: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-row">
      <h1>Market<span class="mark">Edge</span></h1>
      <span class="tag">scaffolding · Phase 5 replaces this</span>
    </div>
    <p class="lede">
      Finds Kalshi markets priced out of line with what the sportsbooks think, and tells you which
      side to buy. Every recommendation is a directional bet, not a lock — the sportsbook consensus
      is an opinion, and it can be wrong.
    </p>
    <div id="status" class="status"><span class="dot"></span><span id="status-text">Loading…</span></div>
  </header>

  <div id="tiles" class="tiles" hidden></div>
  <div class="toolbar">
    <div id="filters" class="filters" hidden></div>
    <div class="fgroup" id="mode-wrap" hidden>
      <div class="flabel">View</div>
      <div class="mode">
        <button id="mode-simple" aria-pressed="true">Simple</button>
        <button id="mode-adv" aria-pressed="false">Advanced</button>
      </div>
    </div>
  </div>
  <div id="content"></div>

  <footer id="footnote"></footer>
</div>

<div id="scrim" class="scrim"></div>
<aside id="panel" class="panel" role="dialog" aria-modal="true" aria-label="Event detail" hidden>
  <button id="panel-close" class="panel-close" aria-label="Close detail">&times;</button>
  <div id="panel-body"></div>
</aside>

<script>
const REFRESH_MS = 45000;
const el = (id) => document.getElementById(id);
const contentEl = el("content"), statusEl = el("status"), statusText = el("status-text");
const tilesEl = el("tiles"), filtersEl = el("filters");

let ALL = [];
let filterSport = "all", filterKind = "all";
let MIN_BOOKS = 3;
let openedFromUrl = false;
// Remembered per session, not persisted — this is a preview, not an app.
let MODE = sessionStorage.getItem("me_mode") === "advanced" ? "advanced" : "simple";
const STAKES = new Map();  // event_id -> stake, so a 45s refresh doesn't wipe input

const setStatus = (kind, text) => { statusEl.className = "status " + kind; statusText.textContent = text; };
const pct = (x, d = 2) => (x == null || Number.isNaN(x)) ? null : (x * 100).toFixed(d) + "%";
const money = (x) => (x == null || Number.isNaN(x)) ? null : "$" + x.toFixed(2);
const cents = (x) => (x == null) ? "—" : Math.round(x * 100) + "¢";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const num = (n) => n == null ? "—" : Math.round(n).toLocaleString();

function kickoff(iso) {
  if (!iso) return "—";
  const dt = new Date(iso);
  return dt.toLocaleDateString(undefined, { month: "short", day: "numeric" })
    + " · " + dt.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

/* Confidence: book count AND available depth. Two independent ways a
   recommendation fails — too few books to trust the consensus, or almost no size
   behind the price — and neither substitutes for the other. Deliberately does
   NOT fold in edge size: a huge edge on one book is not high confidence. */
function confidence(d) {
  const rec = d.recommendation;
  if (!rec) return { bars: 0, label: "" };
  const books = d.n_books ?? 0;
  const size = rec.max_contracts ?? 0;
  const bookScore = books >= 9 ? 2 : books >= 5 ? 1.5 : books >= MIN_BOOKS ? 1 : 0;
  const depthScore = size >= 500 ? 2 : size >= 100 ? 1.5 : size >= 25 ? 1 : size > 0 ? 0.5 : 0;
  const bars = Math.max(1, Math.min(4, Math.round(bookScore + depthScore)));
  return { bars, label: ["", "Weak", "Moderate", "Good", "Strong"][bars] };
}

function confidenceOf(d) {
  if (d.status === "single_source_no_divergence") return 0.12;
  if (d.status === "insufficient_consensus") return 0.34;
  if (d.status === "incomparable_outcomes") return 0.22;
  return 0.55 + 0.45 * Math.min((d.n_books ?? 0) / 9, 1);
}
/* Arbitrage is never dimmed: the fade expresses trust in a probability estimate,
   and arbitrage does not rest on one. */
const opacityOf = (d) => d.is_arbitrage ? "1" : (0.42 + 0.58 * confidenceOf(d)).toFixed(3);

function confBars(d) {
  const c = confidence(d);
  if (!c.bars) return "";
  return `<span class="conf"><span class="conf-bars">${
    [1,2,3,4].map(i => `<i class="${i <= c.bars ? "on" : ""}"></i>`).join("")
  }</span><span class="conf-label">${c.label} confidence</span></span>`;
}

/* ---------------- plain-English copy ---------------- */

/* Why this side, in the user's terms. Built from the event's own numbers —
   every sentence quotes a real value, and no jargon appears in Simple mode. */
function whySimple(d) {
  const r = d.recommendation;
  if (r) {
    const books = d.n_books ?? 0;
    const gap = (r.edge * 100).toFixed(1);
    const what = r.side === "yes"
      ? `<em>${esc(r.team)} to win</em>` : `<em>${esc(r.team)} to lose</em>`;
    return `Kalshi is selling ${what} for ${cents(r.price)}. `
      + `${books} sportsbook${books === 1 ? "" : "s"} price the same outcome nearer `
      + `${cents(r.fair_value)} — about ${gap}¢ of value per contract, if the books are right. `
      + `This is a directional bet: it pays $1 if it happens, and nothing if it doesn't.`;
  }
  if (d.status === "scored")
    return `No edge right now — Kalshi's prices already line up with what the `
      + `${d.n_books ?? 0} sportsbooks think, on both sides. Nothing worth acting on.`;
  if (d.status === "insufficient_consensus")
    return `Only ${d.n_books ?? 0} sportsbook${(d.n_books ?? 0) === 1 ? " has" : "s have"} posted a `
      + `price, which isn't enough to judge whether Kalshi is off. Waiting for more books.`;
  if (d.status === "incomparable_outcomes")
    return `The two sources disagree about which teams are playing, so this can't be compared. `
      + `That's a data problem on our side, not a market signal.`;
  const only = (d.sources || [])[0] === "kalshi" ? "Kalshi" : "the sportsbooks";
  return `Only ${only} has priced this game, so there's nothing to compare it against yet.`;
}

/* Value a REFERENCE stake could actually realise here, used only for ordering.
   Deliberately capped by the resting size: an edge you can only take $1 of is
   not a better opportunity than a smaller edge you can take $100 of. Not shown
   to the user — the confidence bars and the stake simulator carry that. */
const REFERENCE_STAKE = 100;
function reachableValue(d) {
  const r = d.recommendation;
  if (!r || !r.price) return -1;
  const affordable = REFERENCE_STAKE / r.price;
  const contracts = r.max_contracts == null ? affordable : Math.min(affordable, r.max_contracts);
  return r.edge * contracts;
}

function ctxLine(d) {
  const r = d.recommendation;
  const bits = [];
  if (d.n_books) bits.push(`${d.n_books} sportsbook${d.n_books === 1 ? "" : "s"} agree`);
  if (r && r.max_contracts != null) bits.push(`up to ${num(r.max_contracts)} contracts available`);
  return bits.join(" · ");
}

/* Stake simulator. For a DIRECTIONAL bet both outcomes are ALWAYS shown side by
   side — a single expected-value number would read as a promise, and this trade
   makes no promise. Only rendered when a recommendation exists, so it never
   appears on a thin-consensus or single-source event. */
function stakeBlock(d) {
  const r = d.recommendation;
  if (!r) return "";
  const stake = STAKES.get(d.event_id) ?? 100;
  const contracts = stake / r.price;
  const capped = r.max_contracts != null && contracts > r.max_contracts;
  const usable = capped ? r.max_contracts : contracts;
  const spend = usable * r.price;
  const ifWin = usable - spend;
  return `<div class="stake" data-stake-for="${esc(d.event_id)}">
    <label for="s-${esc(d.event_id)}">Stake $</label>
    <input id="s-${esc(d.event_id)}" type="number" min="1" step="10" value="${stake}"
      inputmode="decimal" aria-label="Stake in dollars" />
    <span class="arrow">→</span>
    <span class="outcomes">
      <span class="oc win"><span class="lab">if ${esc(r.wins_if)}</span>+${money(ifWin)}</span>
      <span class="oc lose"><span class="lab">if not</span>−${money(spend)}</span>
    </span>
    ${capped ? `<span class="cap">only ${num(r.max_contracts)} contracts at this price
      (${money(r.max_stake)} max)</span>` : ""}
  </div>`;
}

function kalshiLink(d) {
  // Series page, not a per-event deep link: the per-event URL format could not be
  // verified (every candidate returned HTTP 429), and a dead link on the one
  // button meant to drive action is worse than one extra click.
  if (!d.kalshi_series) return "";
  return `<a class="link" target="_blank" rel="noopener noreferrer"
    href="https://kalshi.com/markets/${esc(d.kalshi_series.toLowerCase())}"
    title="Opens the Kalshi series page for this league">↗ Open on Kalshi</a>`;
}

/* Arbitrage on a card: a muted TEXT tag, and only when Kalshi is actually one of
   the venues. A book-vs-book arbitrage is not a Kalshi decision at all, so it
   stays off the card entirely and appears only in the panel, labelled. */
function arbTag(d) {
  if (!d.is_arbitrage || !d.arbitrage?.includes_kalshi) return "";
  const others = d.arbitrage.venues.filter(v => v !== "kalshi").join(", ");
  return `<span class="arb-tag" title="A separate two-platform trade. Requires an account at ${esc(others)} as well as Kalshi.">ⓘ Cross-platform option available</span>`;
}

function metric(k, v, raw) {
  const has = v != null;
  const cls = !has ? "none" : (typeof raw === "number" && raw < 0 ? "neg" : "");
  return `<div class="m"><div class="k">${k}</div><div class="v ${cls}">${has ? esc(v) : "—"}</div></div>`;
}

function advancedBlock(d) {
  if (MODE !== "advanced") return "";
  const bt = d.best_trade;
  return `<div class="adv"><div class="metrics">
    ${metric("Divergence", pct(d.max_abs_divergence), d.max_abs_divergence)}
    ${metric("Net edge", pct(d.best_net_edge), d.best_net_edge)}
    ${metric("EV @ depth", money(d.best_expected_value), d.best_expected_value)}
    ${metric("Books", d.n_books)}
    ${metric("Depth", bt?.resting_depth != null ? num(bt.resting_depth) : null)}
    ${metric("Status", d.status.replace(/_/g, " "))}
  </div></div>`;
}

function cardFor(d) {
  const r = d.recommendation;
  return `<div class="card ${r ? "actionable" : ""}" style="opacity:${opacityOf(d)}"
      data-event-id="${esc(d.event_id)}">
    <div class="head">
      <div class="matchup">${esc(d.away_team)}<span class="at">@</span>${esc(d.home_team)}</div>
      <div class="when">${esc((d.sport || "").toUpperCase())} · ${kickoff(d.scheduled_start)}</div>
    </div>
    <div class="rec">
      ${r ? `<span class="rec-action">
          <span class="rec-verb">Buy ${esc(r.side)}</span>
          <span class="rec-team">${esc(r.team)}</span>
          <span class="rec-price">${cents(r.price)}</span>
        </span>` : `<span class="rec-none">No recommendation</span>`}
      ${confBars(d)}
    </div>
    <p class="why">${whySimple(d)}</p>
    ${ctxLine(d) ? `<div class="ctx">${ctxLine(d)}</div>` : ""}
    ${stakeBlock(d)}
    ${advancedBlock(d)}
    <div class="foot">
      ${kalshiLink(d)}
      ${arbTag(d)}
      <button class="detail-btn" data-detail-for="${esc(d.event_id)}">Details</button>
    </div>
  </div>`;
}

/* ---------------- list ---------------- */

function counts(list) {
  return {
    all: list.length,
    recommended: list.filter(d => d.recommendation).length,
    arbitrage: list.filter(d => d.is_arbitrage).length,
    scored: list.filter(d => d.status === "scored").length,
    unscoreable: list.filter(d => d.status !== "scored").length,
  };
}

function renderTiles(list) {
  const c = counts(list);
  tilesEl.hidden = false;
  tilesEl.innerHTML = `
    <div class="tile"><div class="k">Events</div><div class="v">${c.all}</div></div>
    <div class="tile accent"><div class="k">Recommendations</div><div class="v">${c.recommended}</div></div>
    <div class="tile"><div class="k">Comparable</div><div class="v">${c.scored}</div></div>
    <div class="tile"><div class="k">Cross-platform</div><div class="v">${c.arbitrage}</div></div>
    <div class="tile"><div class="k">Not comparable</div><div class="v">${c.unscoreable}</div></div>`;
}

function renderFilters(list) {
  const sports = [...new Set(list.map(d => d.sport).filter(Boolean))].sort();
  const c = counts(list);
  const chip = (val, label, n, group) =>
    `<button class="chip" data-group="${group}" data-val="${val}"
       aria-pressed="${(group === "sport" ? filterSport : filterKind) === val}">
       ${esc(label)}<span class="n">${n}</span></button>`;
  filtersEl.hidden = false;
  filtersEl.innerHTML = `
    <div class="fgroup"><div class="flabel">Sport</div><div class="chips">
      ${chip("all", "All", list.length, "sport")}
      ${sports.map(s => chip(s, s.toUpperCase(), list.filter(d => d.sport === s).length, "sport")).join("")}
    </div></div>
    <div class="fgroup"><div class="flabel">Show</div><div class="chips">
      ${chip("all", "All", c.all, "kind")}
      ${chip("recommended", "Recommended", c.recommended, "kind")}
      ${chip("arbitrage", "Cross-platform", c.arbitrage, "kind")}
      ${chip("unscoreable", "Not comparable", c.unscoreable, "kind")}
    </div></div>`;
  filtersEl.querySelectorAll(".chip").forEach(btn => {
    btn.addEventListener("click", () => {
      const { group, val } = btn.dataset;
      if (group === "sport") filterSport = val; else filterKind = val;
      renderFilters(ALL); renderRows(ALL);
    });
  });
}

function applyFilters(list) {
  return list.filter(d => {
    if (filterSport !== "all" && d.sport !== filterSport) return false;
    if (filterKind === "recommended") return !!d.recommendation;
    if (filterKind === "arbitrage") return d.is_arbitrage;
    if (filterKind === "unscoreable") return d.status !== "scored";
    return true;
  });
}

function renderRows(list) {
  const shown = applyFilters(list);
  if (!shown.length) {
    contentEl.innerHTML = `<div class="notice"><strong>Nothing matches this filter.</strong><br>
      ${list.length} event(s) are loaded — clear the filter to see them.</div>`;
    return;
  }
  // Recommendations first, ranked by DOLLARS a normal stake could actually win,
  // not by headline percentage. Ranking by edge alone floats a 1.3¢ edge with 2
  // contracts behind it ($1 max) above a 1.2¢ edge with 6,420 ($96) — the same
  // rate-vs-size confusion the expected-value axis exists to prevent.
  const sorted = shown.slice().sort((a, b) =>
    ((b.recommendation ? 1 : 0) - (a.recommendation ? 1 : 0)) ||
    (reachableValue(b) - reachableValue(a)) ||
    ((b.max_abs_divergence ?? 0) - (a.max_abs_divergence ?? 0)));
  contentEl.innerHTML = `<div class="rows">${sorted.map(cardFor).join("")}</div>`;
  wireCards(contentEl);
}

function wireCards(root) {
  root.querySelectorAll("[data-detail-for]").forEach(b =>
    b.addEventListener("click", (e) => {
      e.stopPropagation();
      const d = ALL.find(x => x.event_id === b.dataset.detailFor);
      if (d) openPanel(d, b);
    }));
  root.querySelectorAll("[data-stake-for] input").forEach(inp =>
    inp.addEventListener("input", () => {
      const holder = inp.closest("[data-stake-for]");
      const id = holder.dataset.stakeFor;
      STAKES.set(id, Math.max(0, parseFloat(inp.value) || 0));
      const d = ALL.find(x => x.event_id === id);
      if (!d) return;
      const tmp = document.createElement("div");
      tmp.innerHTML = stakeBlock(d);
      holder.querySelector(".outcomes").innerHTML = tmp.querySelector(".outcomes").innerHTML;
      const fresh = tmp.querySelector(".cap"), existing = holder.querySelector(".cap");
      if (fresh && existing) existing.replaceWith(fresh);
      else if (fresh) holder.appendChild(fresh);
      else if (existing) existing.remove();
    }));
}

/* ---------------- detail panel ---------------- */

const panel = el("panel"), scrim = el("scrim"), panelBody = el("panel-body");
let lastFocused = null;

function closePanel() {
  panel.classList.remove("open"); scrim.classList.remove("open");
  setTimeout(() => { panel.hidden = true; }, 200);
  const u = new URL(location.href); u.searchParams.delete("event");
  history.replaceState(null, "", u);
  if (lastFocused) lastFocused.focus();
}
el("panel-close").addEventListener("click", closePanel);
scrim.addEventListener("click", closePanel);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && panel.classList.contains("open")) closePanel();
});

const americanStr = (v) => (v > 0 ? "+" : "") + Math.round(v);
const impliedFromAmerican = (v) => (v > 0 ? 100 / (v + 100) : -v / (-v + 100));

function unscoreableReason(d) {
  if (d.status === "single_source_no_divergence") {
    const only = (d.sources || [])[0];
    if (only === "kalshi")
      return "Only Kalshi has priced this game. No sportsbook has posted a line yet, so there is no second opinion to compare against — common for games still weeks out, and for NFL preseason, which the regular-season odds feed does not cover.";
    if (only === "consensus")
      return "Only sportsbooks have priced this game; Kalshi has not listed a market for it.";
    return "Only one source priced this game, so there is nothing to compare against.";
  }
  if (d.status === "insufficient_consensus")
    return `The "consensus" here is a median over just ${d.n_books ?? 0} bookmaker(s), below the floor of ${MIN_BOOKS}. A median over one or two books is not a consensus, so the observed prices are shown but no divergence is scored.`;
  if (d.status === "incomparable_outcomes")
    return "The two sources' outcomes do not line up — a team resolved differently on each side. A data bug, flagged rather than scored across mismatched outcomes.";
  return null;
}

function sparkline(points, color) {
  if (!points || points.length < 2) return "";
  const W = 260, H = 46, PAD = 3;
  const ps = points.map(p => p.p);
  const lo = Math.min(...ps), hi = Math.max(...ps), span = (hi - lo) || 0.02;
  const x = i => PAD + (i / (points.length - 1)) * (W - 2 * PAD);
  const y = v => H - PAD - ((v - lo) / span) * (H - 2 * PAD);
  const path = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.p).toFixed(1)}`).join("");
  const dots = points.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.p).toFixed(1)}" r="1.8" fill="${color}" opacity=".9"/>`).join("");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${path}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/>${dots}</svg>`;
}

function sideCard(label, team, o, hist, color) {
  const series = (hist?.series || []).find(s =>
    s.source === (label === "Kalshi" ? "kalshi" : "consensus") && s.team === team);
  const prob = label === "Kalshi" ? o?.kalshi_probability : o?.consensus_probability;
  const pts = series?.points || [];
  const note = pts.length >= 2 ? `${pts.length} recorded price changes`
    : pts.length === 1 ? "one observation — price hasn't moved since" : "no history recorded yet";
  return `<div class="side">
    <div class="who">${esc(label)}</div><div class="team">${esc(team)}</div>
    <div class="pair"><span>Implied</span><span>${prob == null ? "—" : (prob * 100).toFixed(2) + "%"}</span></div>
    ${label === "Kalshi" && o?.kalshi_ask != null
      ? `<div class="pair"><span>Buy Yes at</span><span>${cents(o.kalshi_ask)}</span></div>
         <div class="pair"><span>Buy No at</span><span>${cents(1 - o.kalshi_bid)}</span></div>` : ""}
    ${label !== "Kalshi" && o?.books ? `<div class="pair"><span>Books</span><span>${Object.keys(o.books).length}</span></div>` : ""}
    ${sparkline(pts, color)}<div class="spark-note">${note}</div></div>`;
}

function booksTable(outcomes) {
  const rows = outcomes.filter(o => o.books && Object.keys(o.books).length);
  if (!rows.length) return "";
  const allBooks = [...new Set(rows.flatMap(o => Object.keys(o.books)))].sort();
  const best = {};
  rows.forEach(o => {
    let bk = null, bp = Infinity;
    for (const [b, v] of Object.entries(o.books)) {
      const ip = impliedFromAmerican(v);
      if (ip < bp) { bp = ip; bk = b; }
    }
    best[o.team] = bk;
  });
  return `<table class="books"><thead><tr><th>Book</th>${rows.map(o => `<th>${esc(o.team)}</th>`).join("")}</tr></thead><tbody>
    ${allBooks.map(b => `<tr><td>${esc(b)}</td>${rows.map(o => {
      const v = o.books[b];
      if (v == null) return "<td>—</td>";
      return `<td class="${best[o.team] === b ? "best" : ""}" title="${(impliedFromAmerican(v) * 100).toFixed(1)}% implied">${americanStr(v)}${best[o.team] === b ? " ★" : ""}</td>`;
    }).join("")}</tr>`).join("")}</tbody></table>
    <div class="spark-note">★ = best available price for that outcome. Raw American odds, vig included.</div>`;
}

function explainRow(name, value, isNeg, text) {
  const na = value == null;
  return `<div class="explain"><div class="top"><span class="name">${esc(name)}</span>
    <span class="val ${na ? "na" : (isNeg ? "neg" : "")}">${na ? "—" : esc(value)}</span></div>
    <p>${text}</p></div>`;
}

/* The arbitrage section — fenced, and explicit about what it requires. Its
   "guaranteed" language lives here and nowhere else. */
function arbSection(d) {
  if (!d.is_arbitrage) return "";
  const a = d.arbitrage;
  const others = a.venues.filter(v => v !== "kalshi");
  const req = a.includes_kalshi
    ? `Requires a Kalshi account <strong>and</strong> an account at ${esc(others.join(", "))}.`
    : `<span class="nokalshi">Requires accounts at ${esc(others.join(" and "))} — <strong>no Kalshi leg</strong>.
       This one cannot be taken on Kalshi at all.</span>`;
  const stake = 100, profit = stake * (1 / a.total_cost - 1);
  return `<div class="sec"><h3>Cross-platform opportunity — a separate product</h3>
    <div class="arb-box">
      <div class="req">${req}</div>
      <p style="margin:0 0 10px;font-size:12.5px;color:var(--text-dim);line-height:1.5">
        Unlike the recommendation above, this covers <em>every</em> outcome, so the payout does not
        depend on who wins. Both legs must fill at these prices, and the figure is gross — before
        fees and execution risk.</p>
      <table class="books"><thead><tr><th>Outcome</th><th>Venue</th><th>Cost</th></tr></thead><tbody>
        ${a.legs.map(l => `<tr><td>${esc(l.team)}</td><td>${esc(l.venue)}</td>
          <td class="best">${(l.implied_price * 100).toFixed(2)}¢</td></tr>`).join("")}
        <tr><td colspan="2"><strong>Total for $1 payout</strong></td>
          <td class="best">${(a.total_cost * 100).toFixed(2)}¢</td></tr>
      </tbody></table>
      <div class="spark-note">Splitting $${stake} across both legs returns about
        <strong style="color:var(--arb)">$${profit.toFixed(2)}</strong> gross, whoever wins.</div>
    </div></div>`;
}

async function openPanel(d, trigger) {
  lastFocused = trigger || null;
  panel.hidden = false;
  requestAnimationFrame(() => { panel.classList.add("open"); scrim.classList.add("open"); });
  const u = new URL(location.href); u.searchParams.set("event", d.event_id);
  history.replaceState(null, "", u);

  const r = d.recommendation;
  panelBody.innerHTML = `
    <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">
      ${esc([...new Set([(d.sport||"").toUpperCase(),(d.league||"").toUpperCase()].filter(Boolean))].join(" · "))} · ${kickoff(d.scheduled_start)}</div>
    <h2 style="margin:6px 0 10px;font-size:19px;font-weight:650;letter-spacing:-.01em">
      ${esc(d.away_team)} <span style="color:var(--muted);font-weight:400">@</span> ${esc(d.home_team)}</h2>
    <div class="rec">
      ${r ? `<span class="rec-action"><span class="rec-verb">Buy ${esc(r.side)}</span>
        <span class="rec-team">${esc(r.team)}</span><span class="rec-price">${cents(r.price)}</span></span>`
        : `<span class="rec-none">No recommendation</span>`}
      ${confBars(d)}
    </div>
    <p class="why">${whySimple(d)}</p>
    ${stakeBlock(d)}
    <div class="foot">${kalshiLink(d)}</div>
    <div id="panel-detail"><div class="spark-note" style="margin-top:18px">Loading price history…</div></div>`;
  wireCards(panelBody);

  let hist = null;
  try {
    const res = await fetch(`/events/${d.event_id}/history`);
    if (res.ok) hist = await res.json();
  } catch (_) { /* history is optional — the panel is useful without it */ }

  const why = unscoreableReason(d);
  const outs = d.outcomes || [];
  el("panel-detail").innerHTML = `
    ${why ? `<div class="sec"><h3>Why there are no numbers here</h3>
      <div class="explain"><p>${why}</p></div></div>` : ""}
    ${outs.map(o => `<div class="sec"><h3>${esc(o.team || "outcome")}</h3><div class="compare">
      ${sideCard("Kalshi", o.team, o, hist, "var(--arb)")}
      ${sideCard("Sportsbook consensus", o.team, o, hist, "var(--signal-dim)")}
    </div></div>`).join("")}
    ${arbSection(d)}
    <div class="sec"><h3>The math</h3>
      ${explainRow("Divergence", pct(d.max_abs_divergence), false,
        "How far apart the two sources' <em>beliefs</em> are, comparing vig-stripped mid prices. A measurement of disagreement — it says nothing about whether you could act on it.")}
      ${explainRow("Net edge after spread", pct(d.best_net_edge), (d.best_net_edge ?? 0) < 0,
        "What is left once you pay to cross Kalshi's bid-ask spread. Priced off the raw executable book, because you transact at the touch. Negative means the disagreement is smaller than the cost of acting on it.")}
      ${explainRow("Expected value at depth", money(d.best_expected_value), (d.best_expected_value ?? 0) < 0,
        "The edge multiplied by the size actually resting at that price. A healthy percentage on two contracts is worth pennies.")}
    </div>
    <div class="sec"><h3>Consensus detail${d.n_books ? ` · ${d.n_books} books` : ""}</h3>
      ${booksTable(outs) || '<div class="spark-note">No per-book prices recorded.</div>'}</div>
    <div class="sec"><h3>Matching &amp; provenance</h3>
      <dl class="meta">
        <dt>Home/away</dt><dd>${d.home_away_source === "odds_api"
          ? '<span class="pill auth">odds_api — authoritative</span>'
          : `<span class="pill">${esc(d.home_away_source || "unknown")} — provisional</span>`}</dd>
        <dt>Sources</dt><dd>${esc((d.sources || []).join(", ") || "—")}</dd>
        <dt>Kalshi ticker</dt><dd>${esc(d.kalshi_event_ticker || "—")}</dd>
        <dt>Odds API id</dt><dd>${esc(d.odds_api_event_id || "—")}</dd>
        <dt>Event id</dt><dd>${esc(d.event_id)}</dd>
      </dl></div>`;
}

/* ---------------- mode toggle ---------------- */

function applyMode() {
  el("mode-simple").setAttribute("aria-pressed", MODE === "simple");
  el("mode-adv").setAttribute("aria-pressed", MODE === "advanced");
  el("footnote").innerHTML = MODE === "simple"
    ? `Every recommendation is a <strong style="color:var(--text-dim)">directional bet</strong>, not a
       guarantee — it pays only if the sportsbook consensus turns out to be the better estimate.
       Faded cards are low-confidence and are shown rather than hidden. Auto-refreshes every 45s.`
    : `<strong style="color:var(--text-dim)">Divergence</strong> = belief gap (vig-stripped mids).
       <strong style="color:var(--text-dim)">Net edge</strong> = what survives crossing Kalshi's spread
       (raw executable book). <strong style="color:var(--text-dim)">EV @ depth</strong> = edge × resting size.
       <strong style="color:var(--arb)">Cross-platform arbitrage</strong> is a separate product requiring a
       second account; its profit is gross, before fees. Auto-refreshes every 45s.`;
  if (ALL.length) renderRows(ALL);
}
el("mode-simple").addEventListener("click", () => {
  MODE = "simple"; sessionStorage.setItem("me_mode", MODE); applyMode();
});
el("mode-adv").addEventListener("click", () => {
  MODE = "advanced"; sessionStorage.setItem("me_mode", MODE); applyMode();
});

/* ---------------- load ---------------- */

async function refresh() {
  try {
    const res = await fetch("/divergences?limit=500", { headers: { Accept: "application/json" } });
    if (!res.ok) {
      setStatus("error", `/divergences returned HTTP ${res.status}`);
      contentEl.innerHTML = `<div class="notice"><strong>Unexpected response.</strong><br>
        <code>GET /divergences</code> returned HTTP ${res.status}.</div>`;
      return;
    }
    const data = await res.json();
    ALL = Array.isArray(data) ? data : (data.divergences || []);
    MIN_BOOKS = data.min_consensus_books ?? MIN_BOOKS;
    if (!ALL.length) {
      tilesEl.hidden = filtersEl.hidden = true;
      setStatus("live", "Live · no events yet");
      contentEl.innerHTML = `<div class="notice"><strong>No events returned.</strong></div>`;
      return;
    }
    const c = counts(ALL);
    setStatus("live", `Live · ${c.all} events · ${c.recommended} recommendation(s) · `
      + `${c.arbitrage} cross-platform · updated ${new Date().toLocaleTimeString()}`);
    el("mode-wrap").hidden = false;
    renderTiles(ALL); renderFilters(ALL); applyMode();

    const want = new URLSearchParams(location.search).get("event");
    if (want && !openedFromUrl) {
      const d = ALL.find(x => x.event_id === want);
      if (d) { openedFromUrl = true; openPanel(d, null); }
    }
  } catch (err) {
    setStatus("error", "Network error reaching the API");
    contentEl.innerHTML = `<div class="notice"><strong>Couldn't reach the API.</strong><br>
      Is the FastAPI service running? (${esc(err)})</div>`;
  }
}

refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
