# Alembic config for MarketEdge.
# Run from the repo root, e.g.:
#   alembic -c db/migrations/alembic.ini upgrade head
# The database URL is read from the DATABASE_URL env var in env.py (not set here),
# so no credentials live in this file.
[alembic]
script_location = db/migrations
prepend_sys_path = backend
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
