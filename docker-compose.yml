# Services: postgres, api, scheduler (Kalshi ingest), frontend (Next.js).
#
# Build context is the repo root so the image contains both ./backend and
# ./db/migrations. The whole repo is bind-mounted at /app for live reload; the
# arbitrium package is importable via PYTHONPATH=/app/backend.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arbitrium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arbitrium}
      POSTGRES_DB: ${POSTGRES_DB:-arbitrium}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arbitrium} -d ${POSTGRES_DB:-arbitrium}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://arbitrium:arbitrium@postgres:5432/arbitrium}
    working_dir: /app/backend
    command: uvicorn arbitrium.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://arbitrium:arbitrium@postgres:5432/arbitrium}
    working_dir: /app/backend
    command: python -m scheduler.flows
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

  # The browser never talks to the API directly — the Next server proxies it at
  # /api/be, so BACKEND_URL is an internal service name and no CORS policy is
  # needed on FastAPI. node_modules is masked with an anonymous volume so the
  # container's install is not shadowed by a host one built for another arch.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://api:8000}
    working_dir: /app
    command: pnpm dev --port 3000 --hostname 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  # Pinned to an explicit name, and the name is the OLD project's.
  #
  # Compose derives a volume's real name from the project directory, so renaming
  # marketedge -> arbitrium silently pointed postgres at a brand-new, empty
  # `arbitrium_pgdata` and left every ingest run, odds snapshot, and graded
  # calibration record sitting in `marketedge_pgdata`. Nothing was deleted; the
  # stack was simply looking in the wrong place.
  #
  # Pinning `name:` decouples the volume from the project name, so this cannot
  # happen again on a future rename. The stale-looking `marketedge_pgdata` is
  # deliberate: renaming the volume for tidiness would mean copying a live
  # postgres data directory, and that is real risk taken on for a cosmetic
  # gain. The data is what matters, not what the volume is called.
  pgdata:
    name: marketedge_pgdata
